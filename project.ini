[data]
editorCommand = nvim .
lang = cpp
envCommand = 

[terminal]
command = project-manager build 

[run]
command = ./build/basic arun ./examples/01_hello_world.mylang

[build]
prepare = cmake ..
directory = build
command = make -j12


[script_install]
command = sudo make install
directory = build

[script_clean]
command = rm -rf build
directory = .

[script_dump]
command = python scripts/merge.py; cat all_code.txt | wl-copy

[script_test]
command = ./build/unit_tests

[script_test_examples]
command = python scripts/check_examples.py 
